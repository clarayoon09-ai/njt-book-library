<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너진똑 도서관</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#302c2b;--muted:#817774;--pink:#ffe4e8;--rose:#ff8da1;--cream:#fffaf2;--line:#f0e5dc;--mint:#e1f4e9;--lav:#eee8ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 8% 8%,#ffeaf0 0,transparent 24%),radial-gradient(circle at 92% 20%,#e8f7ef 0,transparent 25%),var(--cream);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
header{padding:36px 18px 26px;text-align:center}
.panda{display:flex;justify-content:center;align-items:center;line-height:1;margin:0 auto 12px}.panda img{display:block;width:clamp(112px,22vw,180px);height:auto;border-radius:50%;object-fit:cover;filter:drop-shadow(0 5px 0 #f5d8d7)}
h1{font-family:'Jua',sans-serif;font-size:clamp(30px,5vw,46px);margin:12px 0 8px;letter-spacing:-.5px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto;max-width:620px}
.wrap{width:min(1100px,calc(100% - 28px));margin:0 auto 48px}
.toolbar{position:sticky;top:0;z-index:5;background:#fffaf2eF;backdrop-filter:blur(12px);padding:12px 0 14px}
.searchrow{display:flex;gap:9px;align-items:center}
.search{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:16px;padding:14px 16px;font:inherit;outline:none;box-shadow:0 4px 12px #60433c08}
.search:focus{border-color:var(--rose);box-shadow:0 0 0 3px #ff8da122}
.count{white-space:nowrap;font-size:13px;color:var(--muted);padding:0 6px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 13px;font:inherit;font-size:12px;color:#675d59;cursor:pointer}
.filter.active{background:var(--pink);border-color:#ffc5ce;color:#8b4553;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:10px}
.card{background:#fff;border:1px solid #f1e8e1;border-radius:22px;padding:18px;box-shadow:0 7px 22px #65473a08;display:flex;flex-direction:column;min-height:230px;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #65473a12}
.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-size:11px;background:var(--mint);color:#46705a;border-radius:8px;padding:5px 8px;font-weight:700}
.number{font-size:11px;color:#b6a9a3}
h2{font-size:18px;line-height:1.45;margin:13px 0 7px;overflow-wrap:anywhere}
.author{font-size:12px;color:var(--muted);margin:0 0 12px}
.video-title{font-size:12px;line-height:1.6;background:#fff8f7;border-radius:12px;padding:10px 11px;color:#705c59;margin:0 0 14px}
.meta{font-size:12px;line-height:1.65;margin:0 0 10px;color:#6c625e}
.meta strong{color:#8b4553;margin-right:4px}
.keywords{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.keyword{font-size:11px;background:#f4f0ff;color:#6a5a91;border-radius:999px;padding:4px 8px}
.actions{display:flex;gap:8px;margin-top:auto}
a.btn{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:11px 8px;font-size:12px;font-weight:800;transition:filter .15s}
a.btn:hover{filter:brightness(.97)}
.video{background:#ff8da1;color:#fff}
.shop{background:#f5f0e9;color:#655750}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:#fff;border-radius:22px;border:1px dashed var(--line)}
footer{text-align:center;color:#9a8d87;font-size:12px;padding:25px 10px 10px;line-height:1.8}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){header{padding-top:28px}.grid{grid-template-columns:1fr;gap:10px}.card{min-height:0;padding:16px}.count{font-size:11px}.search{padding:12px}.actions a.btn{padding:12px 6px}}
</style>
</head>

const root = document.getElementById('books');
const search = document.getElementById('search');
const count = document.getElementById('count');
let sortMode = 'latest';
const esc = value => String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(value){const m=String(value||'').match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);return m?Number(m[1])*10000+Number(m[2])*100+Number(m[3]):0}
function render(){
  const q=search.value.trim().toLocaleLowerCase('ko');
  let shown=books.filter(b=>[b.title,b.author,b.videoTitle,b.date].join(' ').toLocaleLowerCase('ko').includes(q));
  shown.sort((a,b)=>{
    if(sortMode==='title') return a.title.localeCompare(b.title,'ko');
    return sortMode==='oldest' ? dateKey(a.date)-dateKey(b.date) : dateKey(b.date)-dateKey(a.date);
  });
  count.textContent=`${shown.length}권`;
  if(!shown.length){root.innerHTML='<div class="empty">찾는 책이 없어요 🐼<br>다른 검색어로 찾아봐요!</div>';return}
  root.innerHTML=shown.map((b,i)=>`<article class="card">
    <div class="cardtop"><span class="tag">추천도서</span><span class="number">${esc(b.date||'날짜 정보 없음')}</span></div>
    <h2>${esc(b.title)}</h2>
    <p class="author">저자 · ${esc(b.author||'자료에 저자 정보 없음')}</p>
    <p class="video-title">🎬 ${esc(b.videoTitle||'너진똑 영상')}</p>
    <p class="meta"><strong>주제</strong>${esc(b.topic||'인문·교양')}</p>
    <div class="keywords">${String(b.keywords||'핵심 개념, 배경지식, 비판적 사고').split(',').map(k=>`<span class="keyword">#${esc(k.trim())}</span>`).join('')}</div>
    <div class="actions">
      <a class="btn video" href="${esc(b.videoUrl)}" target="_blank" rel="noopener noreferrer">▶ 너진똑 영상 바로 보기</a>
      ${b.shopUrl?`<a class="btn shop" href="${esc(b.shopUrl)}" target="_blank" rel="noopener noreferrer">책 정보</a>`:''}
    </div>
  </article>`).join('');
}
search.addEventListener('input',render);
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{
  sortMode=btn.dataset.sort;
  document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));
  render();
}));
render();
</script>
